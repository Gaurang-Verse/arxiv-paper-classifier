# Baseline model configuration.
sample_path: "data/processed/sample_150k.parquet"
eda_stats_path: "data/processed/eda_stats.json"

# Categories below this dataset-wide frequency are excluded from the label
# space. Rationale and the affected categories are recorded in
# docs/eda_findings.md.
min_label_frequency: 50

# Split fractions. Applied by random row assignment with a fixed seed.
train_fraction: 0.8
val_fraction: 0.1
test_fraction: 0.1
random_seed: 42

tfidf:
  max_features: 50000
  ngram_range: [1, 2]
  min_df: 3
  sublinear_tf: true

model:
  C: 1.0
  max_iter: 1000

# Probability above which a label is predicted as present.
prediction_threshold: 0.5