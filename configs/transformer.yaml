# DistilBERT fine-tuning on a 20,000-row training subsample.
# This was the first transformer run, done locally on an Apple M4 (MPS),
# about 2 hours. The shipped model uses configs/transformer_full.yaml.
sample_path: "data/processed/sample_150k.parquet"
eda_stats_path: "data/processed/eda_stats.json"
min_label_frequency: 50

# Same split fractions/seed as configs/baseline.yaml — this regenerates
# the IDENTICAL train/val/test index split as the baseline (same 150K
# sample, same seed = same deterministic shuffle), so the validation set
# used here is the exact same 15,000 papers the baseline was evaluated on.
train_fraction: 0.8
val_fraction: 0.1
test_fraction: 0.1
random_seed: 42

# Subsample the TRAINING portion only (never val/test) down to this size,
# because fine-tuning on a laptop is far slower per example than the
# baseline. A separate seed controls this subsampling so it's
# reproducible independently of the split above.
train_subsample_size: 20000
train_subsample_seed: 123

model_name: "distilbert-base-uncased"
max_length: 256

training:
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 2.0e-5   # not "2e-5": PyYAML parses that as a string
  weight_decay: 0.01

prediction_threshold: 0.5
output_dir: "data/processed/transformer_checkpoints"
results_path: "data/processed/transformer_results.json"