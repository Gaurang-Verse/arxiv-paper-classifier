[project]
name = "arxiv-classifier"
version = "0.1.0"
description = "Multi-label classification of arXiv papers into subject categories — MLOps reference pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "torch>=2.2",
    "transformers>=4.38",
    "accelerate>=1.1.0",
    "mlflow>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]